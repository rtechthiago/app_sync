on:
  push:

env:
  MODULE_SOURCE: ${{ vars.NETWORKING }}
  VPC_CIDR: "10.0.0.0/16"
  SUBNET_CIDR: "10.0.1.0/24"
  AVAILABILITY_ZONE: "us-east-2a"
  SQS_QUEUE_NAME: "app-sync-queue"

jobs:
  check_custom_properties:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"

      - name: Check Custom Properties
        run: |
          # Debug: Listar arquivos para confirmar o diretório de execução
          echo "--- Arquivos no diretório atual ---"
          ls -R
          
          # Obtendo todas as custom properties em formato JSON
          PROPS_JSON='${{ toJSON(github.event.repository.custom_properties) }}'
          echo "--- Custom Properties JSON ---"
          echo "$PROPS_JSON"

          MODULES_ADDED=false
          : > main.tf
          
          # Verifica se 'VPC' está presente nas propriedades
          if echo "$PROPS_JSON" | grep -q '"VPC"'; then
            echo "--- Alvo: VPC detectado ---"

            if [ -z "$NETWORKING_MODULE_SOURCE" ]; then
              echo "Erro: configure a variavel NETWORKING em Settings > Secrets and variables > Actions > Variables."
              exit 1
            fi

            cat >> main.tf <<EOF
          module "my_networking" {
            source            = "${MODULE_SOURCE}networking?ref=main"
            vpc_cidr          = "${VPC_CIDR}"
            subnet_cidr       = "${SUBNET_CIDR}"
            availability_zone = "${AVAILABILITY_ZONE}"
          }

          EOF

            MODULES_ADDED=true
          fi
          
          # Verifica se 'SQS' está presente nas propriedades
          if echo "$PROPS_JSON" | grep -q '"SQS"'; then
            echo "--- Alvo: SQS detectado ---"

            if [ -z "$SQS_MODULE_SOURCE" ]; then
              echo "Erro: configure a variavel SQS em Settings > Secrets and variables > Actions > Variables."
              exit 1
            fi

            cat >> main.tf <<EOF
          module "my_sqs" {
            source     = "${MODULE_SOURCE}load_balancer?ref=main"
            queue_name = "${SQS_QUEUE_NAME}"
          }

          EOF

            MODULES_ADDED=true
          fi

          if [ "$MODULES_ADDED" = "true" ]; then
            echo "--- main.tf gerado ---"
            cat main.tf

            terraform fmt -check
            terraform init -input=false

            set +e
            terraform plan -input=false -no-color -detailed-exitcode
            PLAN_EXIT_CODE=$?
            set -e

            if [ "$PLAN_EXIT_CODE" -eq 0 ]; then
              echo "--- Componentes ja existem no state e nao possuem alteracoes ---"
            elif [ "$PLAN_EXIT_CODE" -eq 2 ]; then
              echo "--- Existem componentes novos ou alteracoes para aplicar ---"
            else
              echo "--- Erro ao executar terraform plan ---"
              exit "$PLAN_EXIT_CODE"
            fi
          else
            echo "--- Nenhum modulo habilitado nas custom properties ---"
          fi

  compara_diretorios:
    needs: check_custom_properties
    uses: robthross/gitactions/.github/workflows/check-template.yml@develop
